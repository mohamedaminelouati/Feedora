AutoName: Read You Pro
Summary: Modern Material You Android RSS Reader

Description: |-
  Read You Pro is an elegant, modern RSS reader for Android crafted with Jetpack Compose following Material You principles with zero tracking and full privacy.

  Features:
  * Native Cloud RSS Engines: Miniflux, Tiny Tiny RSS, Feedbin, Inoreader, Feedly, Fever & Google Reader API
  * AI Article Summarization & Instant Translation
  * Material You dynamic theming and AMOLED dark mode
  * Automated scheduled backups to WebDAV, FTP, FTPS, and SFTP
  * 51 synchronized regional languages
  * Complete privacy: zero tracking, zero ads, zero data collection

